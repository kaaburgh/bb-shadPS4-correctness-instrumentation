name: Buffer live-range observer source patch

on:
  pull_request:
    paths:
      - 'tools/prepare_buffer_live_range_observer_patch.py'
      - 'tests/test_prepare_buffer_live_range_observer_patch.py'
      - 'docs/instrumentation/buffer-live-range-source-patch.md'
      - '.github/workflows/buffer-live-range-observer-patch.yml'
  push:
    branches: [main]
    paths:
      - 'tools/prepare_buffer_live_range_observer_patch.py'
      - 'tests/test_prepare_buffer_live_range_observer_patch.py'
      - 'docs/instrumentation/buffer-live-range-source-patch.md'
      - '.github/workflows/buffer-live-range-observer-patch.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run focused regressions
        run: python -m unittest tests.test_prepare_buffer_live_range_observer_patch -v
      - name: Fetch exact pinned upstream source
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/shadps4-emu/shadPS4/28c84fb5a7b19c7fb86156a1d6bb3e7e5a6cef64/src/video_core/buffer_cache/buffer_cache.cpp \
            -o buffer_cache.cpp
      - name: Prepare exact source patch
        run: |
          python tools/prepare_buffer_live_range_observer_patch.py \
            buffer_cache.cpp \
            --source-commit 28c84fb5a7b19c7fb86156a1d6bb3e7e5a6cef64 \
            --output buffer-live-range-observer.patch
          grep -F 'SHADPS4_BB_BUFFER_LIVE_RANGE_OBSERVE(buffer_id, buffer.CpuAddr(), buffer.SizeBytes(), true)' buffer-live-range-observer.patch
          grep -F 'SHADPS4_BB_BUFFER_LIVE_RANGE_OBSERVE(buffer_id, buffer.CpuAddr(), buffer.SizeBytes(), false)' buffer-live-range-observer.patch
          test "$(grep -c '^@@' buffer-live-range-observer.patch)" -eq 2
