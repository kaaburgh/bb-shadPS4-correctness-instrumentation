name: Reconcile agentic-repo-kit instructions

on:
  push:
    branches:
      - tmp/reconcile-agentic-repo-kit-docs

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/reconcile-agentic-repo-kit-docs
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download and verify agentic-repo-kit v0.1.9
        shell: bash
        run: |
          set -euo pipefail
          KIT_PATH="$RUNNER_TEMP/agentic-repo-kit-0.1.9.pyz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$KIT_PATH" \
            https://github.com/kaaburgh/agentic-repo-kit/releases/download/v0.1.9/agentic-repo-kit-0.1.9.pyz
          actual="$(sha256sum "$KIT_PATH" | awk '{print $1}')"
          test "$actual" = "79e914bc322873025f41db0ffa118bd037362b77708e4433bb854d8dd42b041e"
          echo "KIT_PATH=$KIT_PATH" >> "$GITHUB_ENV"
      - name: Update project-owned guidance
        run: python scripts/reconcile_agentic_repo_docs_tmp.py
      - name: Regenerate and validate managed outputs
        shell: bash
        run: |
          set -euo pipefail
          python "$KIT_PATH" upgrade .
          python "$KIT_PATH" check .
      - name: Commit reconciled tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/reconcile-agentic-repo-kit-docs.yml
          git rm scripts/reconcile_agentic_repo_docs_tmp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md .agentic-repo.lock.json docs/agent-policy.local.md docs/agentic-repo-kit.md
          git commit -m "Reconcile agentic-repo-kit acquisition guidance"
          git push origin HEAD:tmp/reconcile-agentic-repo-kit-docs
