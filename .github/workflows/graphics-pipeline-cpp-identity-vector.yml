name: Graphics pipeline C++ identity vector

on:
  pull_request:
    paths:
      - '.github/workflows/graphics-pipeline-cpp-identity-vector.yml'
      - 'docs/instrumentation/examples/graphics-pipeline-cpp-identity-vector.synthetic.json'
      - 'docs/instrumentation/examples/graphics-identity.synthetic.json'
      - 'docs/instrumentation/graphics-pipeline-key-surface.json'
      - 'tests/test_graphics_pipeline_cpp_identity_vector.py'
      - 'tools/graphics_pipeline_cpp_identity_vector.py'
      - 'tools/graphics_identity_model.py'
      - 'tools/graphics_pipeline_key_surface.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/graphics-pipeline-cpp-identity-vector.yml'
      - 'docs/instrumentation/examples/graphics-pipeline-cpp-identity-vector.synthetic.json'
      - 'docs/instrumentation/examples/graphics-identity.synthetic.json'
      - 'docs/instrumentation/graphics-pipeline-key-surface.json'
      - 'tests/test_graphics_pipeline_cpp_identity_vector.py'
      - 'tools/graphics_pipeline_cpp_identity_vector.py'
      - 'tools/graphics_identity_model.py'
      - 'tools/graphics_pipeline_key_surface.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run conformance-vector regressions
        run: python -m unittest tests.test_graphics_pipeline_cpp_identity_vector -v
      - name: Validate committed conformance vector
        run: python tools/graphics_pipeline_cpp_identity_vector.py docs/instrumentation/examples/graphics-pipeline-cpp-identity-vector.synthetic.json
