name: Trace event contract

on:
  pull_request:
    paths:
      - '.github/workflows/trace-event-contract.yml'
      - 'schemas/trace-event.schema.json'
      - 'tools/**'
      - 'tests/test_trace_event_model.py'
      - 'docs/instrumentation/schema.md'
      - 'docs/instrumentation/examples/trace-events.synthetic.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/trace-event-contract.yml'
      - 'schemas/trace-event.schema.json'
      - 'tools/**'
      - 'tests/test_trace_event_model.py'
      - 'docs/instrumentation/schema.md'
      - 'docs/instrumentation/examples/trace-events.synthetic.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - run: python -m unittest tests.test_trace_event_model -v
      - run: python tools/trace_event_model.py docs/instrumentation/examples/trace-events.synthetic.json
