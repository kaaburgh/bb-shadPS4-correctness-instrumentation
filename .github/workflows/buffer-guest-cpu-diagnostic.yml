name: Buffer guest CPU diagnostic contract

on:
  pull_request:
    paths:
      - 'schemas/buffer-guest-cpu-diagnostic.schema.json'
      - 'tools/buffer_guest_cpu_diagnostic.py'
      - 'tests/test_buffer_guest_cpu_diagnostic.py'
      - 'docs/instrumentation/buffer-guest-cpu-diagnostic.md'
      - 'docs/instrumentation/examples/buffer-guest-cpu-diagnostic.synthetic.json'
      - 'tools/buffer_resource_id_binding.py'
      - 'tools/guest_cpu_resource_correlation.py'
      - 'schemas/buffer-resource-id-binding.schema.json'
      - 'schemas/guest-cpu-resource-correlation.schema.json'
      - 'schemas/trace-event.schema.json'
      - '.github/workflows/buffer-guest-cpu-diagnostic.yml'
  push:
    branches: [main]
    paths:
      - 'schemas/buffer-guest-cpu-diagnostic.schema.json'
      - 'tools/buffer_guest_cpu_diagnostic.py'
      - 'tests/test_buffer_guest_cpu_diagnostic.py'
      - 'docs/instrumentation/buffer-guest-cpu-diagnostic.md'
      - 'docs/instrumentation/examples/buffer-guest-cpu-diagnostic.synthetic.json'
      - 'tools/buffer_resource_id_binding.py'
      - 'tools/guest_cpu_resource_correlation.py'
      - 'schemas/buffer-resource-id-binding.schema.json'
      - 'schemas/guest-cpu-resource-correlation.schema.json'
      - 'schemas/trace-event.schema.json'
      - '.github/workflows/buffer-guest-cpu-diagnostic.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - run: python -m unittest tests.test_buffer_guest_cpu_diagnostic -v
      - name: Run committed synthetic producer fixture
        run: |
          python tools/buffer_guest_cpu_diagnostic.py \
            docs/instrumentation/examples/buffer-guest-cpu-diagnostic.synthetic.json \
            > "$RUNNER_TEMP/buffer-guest-cpu-diagnostic.output.json"
      - name: Validate input and generated output against published contract
        run: |
          python - <<'PY'
          import json
          import os
          from jsonschema import Draft202012Validator, FormatChecker

          schema = json.load(open('schemas/buffer-guest-cpu-diagnostic.schema.json', encoding='utf-8'))
          fixture = json.load(open('docs/instrumentation/examples/buffer-guest-cpu-diagnostic.synthetic.json', encoding='utf-8'))
          output = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'buffer-guest-cpu-diagnostic.output.json'), encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          validator.validate(fixture)
          validator.validate(output)
          assert output['summary'] == {
              'accepted_accesses': 3,
              'emitted_events': 1,
              'unmapped': 1,
              'ambiguous': 1,
          }
          PY
