name: Resource sync trace contract

on:
  pull_request:
    paths:
      - 'tools/resource_sync_trace.py'
      - 'tools/trace_event_model.py'
      - 'schemas/trace-event.schema.json'
      - 'docs/instrumentation/resources-sync.md'
      - 'docs/instrumentation/examples/resource-sync.synthetic.json'
      - 'tests/test_resource_sync_trace.py'
      - '.github/workflows/resource-sync-trace.yml'
  push:
    branches: [main]
    paths:
      - 'tools/resource_sync_trace.py'
      - 'tools/trace_event_model.py'
      - 'schemas/trace-event.schema.json'
      - 'docs/instrumentation/resources-sync.md'
      - 'docs/instrumentation/examples/resource-sync.synthetic.json'
      - 'tests/test_resource_sync_trace.py'
      - '.github/workflows/resource-sync-trace.yml'

jobs:
  resource-sync-trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - run: python -m unittest tests.test_resource_sync_trace -v
      - run: python tools/resource_sync_trace.py docs/instrumentation/examples/resource-sync.synthetic.json
