name: Guest CPU observer source patch

on:
  pull_request:
    paths:
      - '.github/workflows/guest-cpu-observer-patch.yml'
      - 'tools/prepare_guest_cpu_observer_patch.py'
      - 'tests/test_prepare_guest_cpu_observer_patch.py'
      - 'docs/instrumentation/guest-cpu-observer-source-patch.md'
      - 'tools/shadps4_source_baseline.py'
      - 'docs/baseline/shadps4-source.json'
      - 'tests/test_shadps4_source_baseline.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/guest-cpu-observer-patch.yml'
      - 'tools/prepare_guest_cpu_observer_patch.py'
      - 'tests/test_prepare_guest_cpu_observer_patch.py'
      - 'docs/instrumentation/guest-cpu-observer-source-patch.md'
      - 'tools/shadps4_source_baseline.py'
      - 'docs/baseline/shadps4-source.json'
      - 'tests/test_shadps4_source_baseline.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve pinned BB-BL1 source baseline
        id: baseline
        run: python -m tools.shadps4_source_baseline github-output >> "$GITHUB_OUTPUT"
      - name: Run patch-preparer regressions
        run: python -m unittest tests.test_prepare_guest_cpu_observer_patch -v
      - name: Fetch exact pinned upstream source
        run: |
          python - <<'PY'
          import urllib.request
          url = 'https://raw.githubusercontent.com/shadps4-emu/shadPS4/${{ steps.baseline.outputs.commit }}/src/video_core/page_manager.cpp'
          with urllib.request.urlopen(url, timeout=30) as response:
              data = response.read()
          open('page_manager.cpp', 'wb').write(data)
          PY
      - name: Prepare patch against exact upstream source
        run: |
          python tools/prepare_guest_cpu_observer_patch.py \
            page_manager.cpp \
            --source-commit ${{ steps.baseline.outputs.commit }} \
            --output guest-cpu-observer.patch
          grep -F 'SHADPS4_BB_GUEST_CPU_OBSERVE(addr, Common::IsWriteError(context))' guest-cpu-observer.patch
          test "$(grep -c '^@@' guest-cpu-observer.patch)" -eq 1
