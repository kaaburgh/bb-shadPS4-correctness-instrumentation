name: Graphics pipeline producer patch

on:
  pull_request:
    paths:
      - '.github/workflows/graphics-pipeline-producer-patch.yml'
      - 'tools/prepare_graphics_pipeline_producer_patch.py'
      - 'tests/test_prepare_graphics_pipeline_producer_patch.py'
      - 'docs/instrumentation/graphics-pipeline-producer-source-patch.md'
      - 'tools/shadps4_source_baseline.py'
      - 'docs/baseline/shadps4-source.json'
      - 'tests/test_shadps4_source_baseline.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/graphics-pipeline-producer-patch.yml'
      - 'tools/prepare_graphics_pipeline_producer_patch.py'
      - 'tests/test_prepare_graphics_pipeline_producer_patch.py'
      - 'docs/instrumentation/graphics-pipeline-producer-source-patch.md'
      - 'tools/shadps4_source_baseline.py'
      - 'docs/baseline/shadps4-source.json'
      - 'tests/test_shadps4_source_baseline.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve pinned BB-BL1 source baseline
        id: baseline
        run: python -m tools.shadps4_source_baseline github-output >> "$GITHUB_OUTPUT"
      - name: Run patch-preparer regressions
        run: python -m unittest tests.test_prepare_graphics_pipeline_producer_patch -v
      - name: Fetch exact pinned upstream source
        run: |
          python - <<'PY'
          import urllib.request
          url = 'https://raw.githubusercontent.com/shadps4-emu/shadPS4/${{ steps.baseline.outputs.commit }}/src/video_core/renderer_vulkan/vk_pipeline_cache.cpp'
          with urllib.request.urlopen(url, timeout=30) as response:
              data = response.read()
          open('vk_pipeline_cache.cpp', 'wb').write(data)
          PY
      - name: Prepare patch against exact upstream source
        run: |
          python tools/prepare_graphics_pipeline_producer_patch.py \
            vk_pipeline_cache.cpp \
            --source-commit ${{ steps.baseline.outputs.commit }} \
            --output graphics-pipeline-producer.patch
          grep -F 'SHADPS4_BB_GRAPHICS_PIPELINE_OBSERVE(graphics_key, is_new)' graphics-pipeline-producer.patch
          test "$(grep -c '^@@' graphics-pipeline-producer.patch)" -eq 1
