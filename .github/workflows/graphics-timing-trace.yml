name: Graphics timing trace contract

on:
  pull_request:
    paths:
      - 'tools/**'
      - 'schemas/trace-event.schema.json'
      - 'docs/instrumentation/graphics-timing.md'
      - 'docs/instrumentation/examples/graphics-timing.synthetic.json'
      - 'tests/test_graphics_timing_trace.py'
      - '.github/workflows/graphics-timing-trace.yml'
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'schemas/trace-event.schema.json'
      - 'docs/instrumentation/graphics-timing.md'
      - 'docs/instrumentation/examples/graphics-timing.synthetic.json'
      - 'tests/test_graphics_timing_trace.py'
      - '.github/workflows/graphics-timing-trace.yml'

jobs:
  graphics-timing-trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - run: python -m unittest tests.test_graphics_timing_trace -v
      - run: python tools/graphics_timing_trace.py docs/instrumentation/examples/graphics-timing.synthetic.json
