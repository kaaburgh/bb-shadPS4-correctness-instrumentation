name: Host environment manifest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Run synthetic tests
        run: python -m unittest discover -s tests -v
      - name: Run collector smoke test
        run: python tools/collect_host_environment.py --backend synthetic-smoke --output host-environment.json
      - name: Re-validate smoke manifest with producer
        run: python -c "import json; from tools.collect_host_environment import validate_manifest; validate_manifest(json.load(open('host-environment.json', encoding='utf-8')))"
      - name: Validate smoke manifest against published schema
        run: python -c "import json; from jsonschema import Draft202012Validator, FormatChecker; schema=json.load(open('schemas/host-environment.schema.json', encoding='utf-8')); manifest=json.load(open('host-environment.json', encoding='utf-8')); Draft202012Validator.check_schema(schema); Draft202012Validator(schema, format_checker=FormatChecker()).validate(manifest)"
