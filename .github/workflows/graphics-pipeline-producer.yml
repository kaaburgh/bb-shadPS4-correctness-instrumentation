name: Graphics pipeline producer contract

on:
  pull_request:
    paths:
      - '.github/workflows/graphics-pipeline-producer.yml'
      - 'schemas/graphics-pipeline-producer.schema.json'
      - 'tools/graphics_pipeline_producer_contract.py'
      - 'tests/test_graphics_pipeline_producer_contract.py'
      - 'docs/instrumentation/graphics-pipeline-producer.md'
      - 'docs/instrumentation/examples/graphics-pipeline-producer.synthetic.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/graphics-pipeline-producer.yml'
      - 'schemas/graphics-pipeline-producer.schema.json'
      - 'tools/graphics_pipeline_producer_contract.py'
      - 'tests/test_graphics_pipeline_producer_contract.py'
      - 'docs/instrumentation/graphics-pipeline-producer.md'
      - 'docs/instrumentation/examples/graphics-pipeline-producer.synthetic.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - run: python -m unittest tests.test_graphics_pipeline_producer_contract -v
      - run: python tools/graphics_pipeline_producer_contract.py docs/instrumentation/examples/graphics-pipeline-producer.synthetic.json
      - name: Validate published schema and fixture
        run: >-
          python -c "import json; from jsonschema import Draft202012Validator, FormatChecker; schema=json.load(open('schemas/graphics-pipeline-producer.schema.json', encoding='utf-8')); fixture=json.load(open('docs/instrumentation/examples/graphics-pipeline-producer.synthetic.json', encoding='utf-8')); Draft202012Validator.check_schema(schema); Draft202012Validator(schema, format_checker=FormatChecker()).validate(fixture)"
